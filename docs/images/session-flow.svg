<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">The Focused Break session cycle</title>
  <desc id="desc">Focus with a clear desktop, take a visible break, then choose when to start your next session.</desc>
  <rect width="960" height="260" rx="20" fill="#fff6e3"/>
  <g fill="#fffdf5" stroke="#e6d9c6">
    <rect x="28" y="32" width="276" height="196" rx="14"/>
    <rect x="342" y="32" width="276" height="196" rx="14"/>
    <rect x="656" y="32" width="276" height="196" rx="14"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="#3d1b0b">
    <g font-size="13" fill="#805d45"><text x="52" y="64">01 / FOCUS</text><text x="366" y="64">02 / TAKE A BREAK</text><text x="680" y="64">03 / START AGAIN</text></g>
    <text x="52" y="123" font-size="44" font-weight="500">25:00</text>
    <text x="366" y="123" font-size="26" font-weight="600">Have a break.</text>
    <rect x="680" y="87" width="226" height="48" rx="9" fill="#ffab00"/>
    <text x="793" y="117" font-size="17" font-weight="600" text-anchor="middle">Start next focus</text>
    <g font-size="15" fill="#6e4f3b">
      <text x="52" y="171">A clear desktop.</text><text x="52" y="194">Your time to concentrate.</text>
      <text x="366" y="171">A visible reminder to rest.</text><text x="366" y="194">Your image or a black hole.</text>
      <text x="680" y="171">The app comes forward.</text><text x="680" y="194">You choose when to begin.</text>
    </g>
  </g>
  <g fill="none" stroke="#a64606" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M314 130h17m-6-6 6 6-6 6"/><path d="M628 130h17m-6-6 6 6-6 6"/></g>
</svg>
